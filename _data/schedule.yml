    title: "Pretty Privilege – How Pleasing Words and Visuals Will Help You Get Ahead."
    presenter: "Abby and Alex"
    summary: "In an industry of technical excellence, reports and presentations can seem like an afterthought. This talk will outline why presentation is important, who should care, and how to take your work to the next level by paying attention to the words and visuals you use."
