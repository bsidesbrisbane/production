    title: "SkyJACKER: Why SDR is more Dangerous than Nail Clippers"
    presenter: "Ryan Williams"
    summary: "This talk explores how modern aviation's reliance on insecure systems turns the skies into a playground for those who know where to listen. From ADS-B tracking to ACARS manipulation, this session will break down how software-defined radio (SDR) allows for passive eavesdropping, real-time aircraft spoofing, and unexpected attack surfaces."
    bio: "Ryan 'D8RH8R' Williams is a hacker, researcher, and builder of systems that weren't meant to exist. He spends his time reverse-engineering technology, exploring communication networks, and crafting bespoke offensive hardware. His work spans offensive security, adversarial R&D, and privacy consulting."
    link: ""
    duration: "30 mins"
