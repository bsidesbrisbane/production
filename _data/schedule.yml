    title: "Beyond Passwords: The Present and Future War on Your Online Identity"
    presenter: "Sam Gillespie"
    summary: "Ever wonder why password breaches are still so common? This talk exposes the shocking economics behind credential stuffing attacks and how easy it is for bad actors to profit. We'll explore the industry's fight back, from bot detection to Passkeys, and dive into the looming shift towards an 'identified web' to see how emerging tech like generative AI could either secure or undermine our digital future."
    bio: "Currently a leader in Identity Defense at Okta, Sam Gillespie brings a unique perspective from his background in game development, where he contributed to Fruit Ninja. He later blended game design with data science at Arkose Labs to create state-of-the-art bot detection solutions. With a decade on the front lines of cyber security, Sam is known for his fast-paced and approachable delivery."
    link: "https://au.linkedin.com/in/sam-gillespie-47103644"
