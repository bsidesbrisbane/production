    title: "Deception in Depth Mindset; How to capture an APT"
    presenter: "Brent Muir"
    summary: "This session will introduce the strategy of designing and deploying deception strategies across your environments by leveraging the Mitre Engage adversarial framework. A real-world case study will demonstrate how to implement a deception strategy geared towards the adversaries targeting your organization."
