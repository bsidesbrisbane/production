    bio: "Joe Grand is an American electrical engineer, inventor and hardware hacker known in the hacker community as Kingpin. He achieved mainstream popularity after his appearance on Prototype This!, a Discovery Channel television show. He specialises in reverse engineering and finding security flaws in hardware devices. Grand has testified before the U.S. Senate Committee on Governmental Affairs regarding government and homeland computer security under his internet handle, Kingpin. Learn more at <a href='https://grandideastudio.com/' target='_blank' rel='noopener noreferrer'>Grand Idea Studio</a> and <a href='https://offspec.io/' target='_blank' rel='noopener noreferrer'>offspec.io</a>."
