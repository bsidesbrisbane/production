    title: "Threat Hunting with Better Data Visualisation"
    presenter: "Tatsuya Hasegawa"
    summary: "This session offers best practices for threat hunting with data visualisation. Tatsuya will discuss the challenges of typical SIEM dashboards and introduce more effective approaches, including advanced charts and custom visualisations. Using a practical example with a public dataset, he will demonstrate how to build a unique hunting dashboard and provide attendees with the next steps to level up their threat hunting skills."
    bio: "Tatsuya Hasegawa is a threat hunter and data visualisation developer with an extensive list of security certifications. He is a board member of the ISACA Nagoya Chapter, a committee member of the SECCON Open Conference, and a contributor to the open-source project msticpy."
