    title: "Novel Threats & Nation States: Mastering the ABC'S of Incident Response"
    presenter: "DJ"
    summary: "This session will take you through the 'ABCs' of incident response: identifying compromised Accounts, uncovering hidden Backdoors, and detecting suspicious Command & Control (C2) infrastructure. Using a real-world scenario, I will highlight how a nation-state adversary was detected operating in the shadows of a compromised environment."
    bio: "Dylan is a cyber security leader specializing in digital forensics, incident response, and security advisory. He has spent the last 8 years helping some of the world's leading brands investigate, respond to, and recover from cyber incidents. He actively contributes to open-source projects and has contributed to the MITRE ATT&CK framework."
