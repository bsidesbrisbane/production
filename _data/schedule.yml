    title: "Better AppSec through better DevEx"
    presenter: "Daniel Ting"
    summary: "Good developer experience and cyber security, almost sounds like oxymorons together. But, is it really? How can we make both better, together?
    
    We will explore how we can both improve our developer experience and application security together. How application security and the developer experience overlap, and practical steps that we've observed to have outsized impact on improving both AppSec and DevEx together, that you can take back to your teams and start doing today."
    bio: "Dan has over a decade of experience in IT and cyber security, covering a broad range of specialist technical and leadership roles. Prior to CyberCX, these include roles such as Head of Product, Human-centred Designer, Solutions Architect, Project Manager, Systems Administrator, an AppSec and Product Security educator, a senior security architect, a penetration tester and a data science researcher. 
    
    Today at CyberCX, as a technologist, they leverage their diverse experiences to sherpa and help all roles in engineering teams build safer, more trustworthy, and secure products balancing business, experience, and technical needs. They also have presented at various security conferences including DefCon, BSides Melbourne, and Christchurch Hacker Conference, on various security topics. But at the end of the day, they are just a nerd learning and sharing knowledge to make our community a safer place."
