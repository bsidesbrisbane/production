    title: "Shadow of a Doubt - A Deep-Dive into Shadow OT"
    presenter: "Rhiana Cooke"
    summary: "This talk will highlight why shadow OT is one of the most prevalent cyber issues in the field. I'll walk through why shadow OT is being deployed, the methods used for its detection, and share real-world examples of incidents I've worked on."
    bio: "Rhiana is a Cyber Security Specialist and Mechatronics Engineer with a passion for OT security. As an OT Cyber Security Architect at Secolve, she has worked in both mining and manufacturing, gaining experience with control systems, mobile equipment, and cyber security operations."
