  track1:
    title: "Purple Teaming yo ICS"
    presenter: "Bruce Large"
    summary: |
      In this presentation Bruce is going to build on where it all started for him with Blue Teaming yo ICS and present Purple Teaming yo ICS. In this presentation Bruce will outline the case for why Critical Infrastructure operators need to do purple teaming to ensure they are defensibly managing cyber security risks for their Operational Technology (OT).

      This presentation will start with a primer on purple teaming and walk through how critical asset operators should develop purple team assessments for their OT systems. This presentation will discuss methods to gather relevant Cyber Threat Intelligence to inform their assessments. Critically for asset operators this presentation will discuss why purple teaming needs to happen in a representative test lab environment initially to give both teams confident in their assessments. The presentation will discuss useful tools and techniques to support asset operators plan and execute their purple team assessment and finally Bruce will discuss how he built his home lab to support this presentation.
    bio: "Bruce has 20 years experience working with IT and Operational Technology in network, telecommunications and system engineering roles. Bruce has worked in Electricity Generation & Transmission, Railway, Aviation, Emergency Services and Consulting industries. Bruce is the Founder and Principal Cyber Security Architect at BLARGE."
    link: "https://x.com/beLarge"
    duration: "45 mins"
    rowspan: 3
- time: "11:00"
- time: "11:15"
- time: "11:30"
  track1:
    title: "From Charger to Internal Network: Breaking a Smart EV Charger"
    presenter: "Brendan Scarvell"
    summary: "EV chargers are becoming a common part of home and business networks, but they often don't get much security attention. This talk covers the discovery of a vulnerability leading to remote code execution in a smart EV charger. It also looks at how built-in IoTHotspot functionality can turn a compromised charger into a pivot point into internal networks. The session will walk through the research process, vulnerability discovery, exploitation, and the broader risks of increasingly connected charging infrastructure."
    bio: "Brendan is a security researcher and co-founder of Signal 11, with a background spanning web application, network, hardware, and embedded device security. His work focuses on finding and exploiting vulnerabilities in real-world systems, with a particular interest in connected devices and the security risks created when consumer and business infrastructure overlap."
    link: "https://x.com/bscarvell"
    duration: "30 mins"
    rowspan: 2
- time: "11:45"
