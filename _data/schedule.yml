  track1:
    title: "Cowboys and Endianness"
    presenter: "Macca and James"
    summary: |
      In this talk, Macca and James take a chainsaw to the OSI model and ask a simple question: what happens when the protocol itself is the bypass? Starting from the gloriously unhinged world of custom binary protocols and cursed encapsulation stacks, the team demonstrates live how trivially modern security controls can be defeated when defenders are pattern-matching on protocols they expect to see. Equal parts education and crimes against networking, this talk will leave you questioning every assumption your security stack is quietly making about what 'normal' traffic looks like.

      Warning: may contain interpretive dance.
    bio: "MacLeonard Starkey, better known as Macca, is a Brisbane-based security practitioner with over two decades of incident response experience across the public and private sectors. He currently hunts threats in industrial and operational technology environments at Dragos as a Senior Principal Threat Detection Engineer.<br /><br />Macca has contributed to well-known security publications and has been interviewed on the Risky Business podcast. He is driven by a strong desire to interfere with bad people who do bad things to good people.<br /><br />Despite lacking any talent, he is currently working towards a Ph.D in interpretive dance.<br /><br />James currently works as an AI Security Researcher within the SURGe team at Cisco Foundation AI, primarily creating headaches for LLMs and their owners.<br /><br />He calls Brisbane, Australia home and has spent much of his career supporting law enforcement and emergency services. When he's not causing problems in Python and Rust, he's being \"that guy\" about how Rust avoids the bugs of the past, or contributing to open source projects.<br /><br />He claims it's rarely DNS."
    link: "#"
    duration: "30 mins"
    rowspan: 2
  track2:
    title: "OFDS, Google Earth & KML Mapping Workshop"
    presenter: "Warren Finch"
    summary: |
      This hands-on workshop begins with a detailed introduction to the Open Facility Data Standard (OFDS), Google Earth, and KML for visualising internet infrastructure and facility data.

      After the intro, attendees will work through a guided lab to create their own map.

      **Please bring a laptop** that you can use to install or run QGIS and access Google Earth.
    bio: "Warren joined the Internet Society in June 2025 as an IXP Development Expert, focusing on supporting Internet infrastructure growth and interconnection initiatives across the Asia-Pacific region. With a career in IT that began in 1994, he brings a broad range of experience from technical consulting to Internet community training. He previously served as a Senior Network Analyst/Technical Trainer at APNIC, where he delivered technical workshops and provided support to Internet operators throughout the Asia-Pacific.<br /><br />His technical expertise spans Windows systems, CISCO equipment, virtualisation, technical support, and training delivery. Beyond technical skills, he is deeply committed to building capacity within Internet communities, helping individuals and organisations enhance their knowledge and operational capabilities. He actively contributes to knowledge sharing and is passionate about ensuring that communities have the skills and resources to access and develop the Internet in an inclusive way."
    link: "https://www.linkedin.com/in/warrenfinch/"
    duration: "2 hours"
    rowspan: 8
- time: "10:15"
