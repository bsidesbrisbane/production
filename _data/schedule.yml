    bio: "Joe Grand, also known as Kingpin, is an American computer engineer and hardware hacker. He was a member of the legendary hacker group L0pht Heavy Industries and was a co-host of Prototype This on Discovery Channel. He specialises in creating, exploring, manipulating, and teaching about electronic devices. Learn more at <a href='https://joegrand.com' target='_blank' rel='noopener noreferrer'>joegrand.com</a> and <a href='https://grandideastudio.com' target='_blank' rel='noopener noreferrer'>grandideastudio.com</a>."
