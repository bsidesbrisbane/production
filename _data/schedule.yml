  track1:
    title: "Bypassing Intel CET with Counterfeit Objects"
    presenter: "Thomas Pitt"
    summary: "Intel's Control-Flow Enforcement Technology (CET) provides hardware-assisted control-flow integrity for x86 processors. Despite its effectiveness, some techniques can bypass CET's protections. This presentation will explore Counterfeit Object-Oriented Programming (COOP) to bypass the Intel CET Shadow Stack, using a Chrome sandbox escape targeting the SwiftShader software renderer within the GPU process as a case study."
    bio: "Thomas Pitt is a senior security researcher at Microsoft on the GHOST team. His background is in both offensive and defensive security, with experience spanning from serving as a cyber specialist in the Australian Army, to roles at ParaFlare and Thales."
    link: "https://www.linkedin.com/in/thomas-pitt-9ab543124/"
    duration: "30 mins"
    rowspan: 2
    colspan: 2
- time: "09:15"
- time: "09:30"
  track1:
    title: "Breaking and Defending Entra ID: Recon, Privilege Escalation, and Real-World Attack Paths"
    presenter: "Cameron Fairbairn"
    summary: "This presentation explores the attack surface of Microsoft Entra ID, demonstrating how adversaries can enumerate, exploit, and escalate privileges in cloud and hybrid environments. We will walk through real-world attack chains and outline effective mitigation strategies to strengthen Entra ID security."
    bio: "Cameron Fairbairn is a cyber security architect and the CTO of Proaxiom Cyber. With 28 years in IT and 15 years specialising in cyber security, he has extensive experience in offensive and defensive security, cloud security, and security operations. Cameron is passionate about practical security implementations and adversary-centric defense strategies."
    link: "https://www.linkedin.com/in/cameronfairbairn/"
    duration: "60 mins"
    rowspan: 4
  track2:
    title: "Developer centric security: AppSec for 2025 and beyond"
    presenter: "Ben Gittens"
    summary: "Application security is often seen as a roadblock for developers. This talk explores a new paradigm for AppSec that puts developers at the center, empowering them with the tools and knowledge to build secure applications from the start. We will look at emerging trends and technologies that will shape the future of application security."
    bio: "Ben Gittens is a software developer and security champion with a passion for bridging the gap between development and security teams. He has extensive experience in building and securing large-scale applications and is an advocate for DevSecOps principles."
    link: "https://www.linkedin.com/in/ben-gittens/"
    duration: "30 mins"
