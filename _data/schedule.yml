    title: "Breaking and Defending Entra ID: Recon, Privilege Escalation, and Real-World Attack Paths"
    presenter: "Cameron Fairbairn"
    summary: "This presentation explores the attack surface of Microsoft Entra ID, demonstrating how adversaries can enumerate, exploit, and escalate privileges in cloud and hybrid environments. We will walk through real-world attack chains and outline effective mitigation strategies to strengthen Entra ID security."
    bio: "Cameron Fairbairn is a cybersecurity architect and the CTO of Proaxiom Cyber. With 28 years in IT and 15 years specializing in cybersecurity, he has extensive experience in offensive and defensive security, cloud security, and security operations. Cameron is passionate about practical security implementations and adversary-centric defense strategies."
    link: "https://www.linkedin.com/in/cameronfairbairn/"
    duration: "60 mins"
    rowspan: 4
  track2:
    title: "Developer centric security: AppSec for 2025 and beyond"
    presenter: "Ben Gittens"
    summary: "Application security is often seen as a roadblock for developers. This talk explores a new paradigm for AppSec that puts developers at the center, empowering them with the tools and knowledge to build secure applications from the start. We will look at emerging trends and technologies that will shape the future of application security."
    bio: "Ben Gittens is a software developer and security champion with a passion for bridging the gap between development and security teams. He has extensive experience in building and securing large-scale applications and is an advocate for DevSecOps principles."
    link: "https://www.linkedin.com/in/ben-gittens/"
    duration: "30 mins"
