    title: "Do not obey in advance Cyber Security in the Fight Against Techno-Authoritarianism"
    presenter: "Dr Joel Panther"
    summary: "This talk covers real-world examples where encryption, anonymity tools, and similar technologies have helped activists, journalists, and citizens evade state surveillance and censorship. Discussion and case studies highlight how digital resistance strategies have been used to counter oppression."
    bio: "Joel is a cyber security researcher, penetration tester, and educator with over 15 years' experience in system administration, security, and consulting. His PhD produced a framework for designing dynamically generated penetration testing laboratories, and his current research focuses on offensive security skills development."
