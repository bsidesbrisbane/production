    title: "The importance of threat modelling, and how to get started"
    presenter: "Heath Moodie"
    summary: "This talk will help you understand the core questions to ask when starting a CTI capability, why you should use simple threat models, how to build out your first threat model, and provide actionable templates for getting started in 'Helping to understand and solve problems'."
    bio: "Heath Moodie is a Senior ICS Threat Intelligence Analyst for Dragos APAC. A 5-year RAR veteran and strategy nerd, he is passionate about Cyber Threat Intelligence and its practical application."
    link: "https://www.linkedin.com/in/heath-moodie/"
    duration: "30 mins"
    rowspan: 2
