    title: "Competitive Cyber Tabletop Challenge"
    presenter: "Chris Djamaludin"
    summary: |
      **This workshop runs twice — 13:00 and 15:15.** Choose the session that suits your schedule.

      Step into a facilitated tabletop exercise (TTX) run as a mini CTF challenge. Work through a realistic cyber crisis scenario, make the calls that matter, and see how your decisions stack up against other players in the room.

      Designed for executives, board members, and technical practitioners alike, this 90-minute interactive session puts you at the decision table — not just watching from the sidelines. Your choices are scored as you progress, adding a competitive edge to the learning experience.

      **Please bring your own laptop** to participate in the challenge.
    bio: "Chris is a Co-Founder and Chief Technology Officer for Crisis Commanded, an innovative crisis management product to help organisations prepare and respond to a variety of crisis situations. He is also a Technical Director with NSB Cyber specialising in red team operations and offensive security. Chris plays an active role in the technical development and training of the offensive security practice.<br /><br />His prior roles include penetration testing consulting firms, a top tier consultancy firm, academic institutions, and a multi-national oil and gas company. Most recently he was offensive security national lead at a consulting firm. Through his work and research in both the cyber security and engineering fields, Chris has developed extensive experience with respect to functional security testing involving vulnerability identification and exploitation."
    link: "https://www.linkedin.com/in/chrisdjamaludin/"
    duration: "90 mins"
