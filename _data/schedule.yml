  track1:
    title: "From Head Tattoos to Malware: A History of Steganography"
    presenter: "James Bannan"
    summary: "This presentation traces the fascinating history of steganography, from ancient methods like hidden tattoos to modern digital techniques. It explores its applications in both cybersecurity and cybercrime, examining the ongoing battle between secrecy and detection in the digital age."
    bio: "James is a Principal Consultant with CyberCX specializing in Microsoft Azure architecture, security, and automation with over 25 years of industry experience. He is a published author, a former Microsoft MVP, and a current Microsoft Certified Trainer."
    link: "https://www.linkedin.com/in/jamesbannan/"
