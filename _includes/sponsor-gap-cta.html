<div class="timetravel-sponsor-box">
  <a href="{{ '/sponsorship/' | relative_url }}" class="timetravel-sponsor-cta">
    <span class="timetravel-sponsor-ping" aria-hidden="true"></span>
    <span class="timetravel-sponsor-label">{{ include.label }}</span>
    <span class="timetravel-sponsor-headline">{{ include.headline | default: "We need you" }}</span>
    <span class="timetravel-sponsor-sub">{{ include.sub }}</span>
    <span class="timetravel-sponsor-linkhint">{{ include.hint | default: "Open sponsorship portal →" }}</span>
  </a>
</div>
